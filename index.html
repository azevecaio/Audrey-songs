<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Músicas das Lições – Bebês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF8F2;--ink:#2B2A3A;--muted:#6B6878;--line:#E4DED2;--surface:#FFFFFF;--title:#23305E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161827;--ink:#EDEBF4;--muted:#A9A6B8;--line:#2C2F45;--surface:#1D2033;--title:#AFC0F2;color-scheme:dark} li{--accent:var(--accent-d)!important}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 56px}
header{padding:44px 0 24px;text-align:center}
h1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.15;margin:0 0 8px;color:var(--title)}
header p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{margin-bottom:12px}
li a{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;color:var(--ink);text-decoration:none}
li a:focus-visible{outline:3px solid #F2C14E;outline-offset:2px}
.ic{font-size:34px;line-height:1}
small{display:block;color:var(--muted);font-size:.85rem;font-family:"Fredoka",sans-serif;font-weight:500}
b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;color:var(--accent)}
em{font-style:normal;color:var(--muted);font-size:.9rem}
footer{margin-top:40px;text-align:center;color:var(--muted);font-size:.88rem} footer a{color:var(--title)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Músicas das Lições</h1>
    <p>Escolha a lição para ver as músicas na ordem.</p>
  </header>
  <ul>
    <li style="--accent:#2E6E8E;--accent-d:#9CCBE0"><a href="licao-1/"><span class="ic" aria-hidden="true">🌍</span><span><small>Lição 1</small><b>A Criação</b><em>11 músicas</em></span></a></li>
    <li style="--accent:#4F8A5B;--accent-d:#8CC796"><a href="licao-2/"><span class="ic" aria-hidden="true">🐑</span><span><small>Lição 2</small><b>O Bom Pastor</b><em>7 músicas</em></span></a></li>
    <li style="--accent:#8A5A2B;--accent-d:#E0B184"><a href="licao-3/"><span class="ic" aria-hidden="true">🚢</span><span><small>Lição 3</small><b>Noé e os animais</b><em>7 músicas</em></span></a></li>
    <li style="--accent:#23305E;--accent-d:#AFC0F2"><a href="licao-4/"><span class="ic" aria-hidden="true">⭐</span><span><small>Lição 4</small><b>Bebê Jesus</b><em>9 músicas</em></span></a></li>
  </ul>
  <footer>Músicas e partituras: <a href="https://mais.cpb.com.br/audio-infantil/musicas-bebes-primeiros-passos/" target="_blank" rel="noopener">CPB mais – Bebês, Primeiros Passos</a></footer>
</div>
</body>
</html>
